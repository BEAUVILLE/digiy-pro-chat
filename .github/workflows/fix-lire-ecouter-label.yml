name: Fix Lire écouter label

on:
  push:
    paths:
      - '.github/workflows/fix-lire-ecouter-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Lire / écouter explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="https://digiylyfe.net/" target="_blank" rel="noopener noreferrer"><i>🎧</i><small>Écouter</small></a>'
          new = '<a href="https://digiylyfe.net/" target="_blank" rel="noopener noreferrer" aria-label="Lire et écouter sur DIGIYLYFE.net"><i>🎧</i><small>Lire / écouter</small></a>'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          elif 'Lire / écouter</small>' not in s:
              raise SystemExit('Lien dock Écouter introuvable')
          PY
          git config user.name "DIGIY LYFE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-lire-ecouter-label.yml
          git commit -m "UI: show Lire / écouter in RÉSEAU dock"
          git push