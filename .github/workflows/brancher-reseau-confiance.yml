name: Brancher la confiance circulaire RÉSEAU

on:
  push:
    paths:
      - '.github/workflows/brancher-reseau-confiance.yml'

permissions:
  contents: write

jobs:
  brancher:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le module
        uses: actions/checkout@v4

      - name: Charger la nouvelle mission RÉSEAU
        shell: python
        run: |
          from pathlib import Path

          tag = '<script src="./assets/js/reseau-confiance.js?v=20260801-v1" defer></script>'
          for filename in ('index.html', 'hub.html'):
              page = Path(filename)
              html = page.read_text(encoding='utf-8')
              if tag not in html:
                  marker = '</body>'
                  position = html.find(marker)
                  if position < 0:
                      raise SystemExit(f'Balise </body> introuvable dans {filename}')
                  html = html[:position] + tag + '\n' + html[position:]
                  page.write_text(html, encoding='utf-8')

          workflow = Path('.github/workflows/brancher-reseau-confiance.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Publier la modification ciblée
        run: |
          git config user.name "DIGIYLYFE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html hub.html .github/workflows/brancher-reseau-confiance.yml
          git diff --cached --quiet && exit 0
          git commit -m "Installer le réseau de confiance circulaire"
          git push
