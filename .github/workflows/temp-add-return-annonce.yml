name: Temp add DIGIY return annonce

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-add-return-annonce.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add strong DIGIYLYFE return
        shell: python
        run: |
          from pathlib import Path
          p = Path('annonce.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-digiy-return-home="1"'
          if marker not in s:
              old = '<body>\n  <div class="app">'
              new = '''<body>\n  <div data-digiy-return-home="1" style="width:min(1180px,100%);margin:12px auto 0;padding:0 14px;box-sizing:border-box">\n    <a href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#073f32;color:#fff;text-decoration:none;font:950 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;box-shadow:0 8px 20px rgba(0,0,0,.22);box-sizing:border-box">← RETOUR DIGIYLYFE.COM</a>\n  </div>\n  <div class="app">'''
              if old not in s:
                  raise SystemExit('Anchor not found')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit final change and remove temporary workflow
        run: |
          git config user.name "DIGIYLYFE Atelier"
          git config user.email "actions@users.noreply.github.com"
          git add annonce.html
          git rm .github/workflows/temp-add-return-annonce.yml
          git commit -m "UI: add DIGIYLYFE.COM return on annonce"
          git push
