name: RÉSEAU — retour DIGIYLYFE 6 pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reseau-retour-universel-20260822.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ajouter le retour universel
        shell: python
        run: |
          from pathlib import Path

          files = [
              'fiche.html',
              'journal.html',
              'question.html',
              'hub.html',
              'lexique-reseau.html',
              'affiche.html',
          ]

          block = '''\n  <div data-digiy-return-home="1" style="width:min(1180px,100%);margin:12px auto 0;padding:0 14px;box-sizing:border-box">\n    <a href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#073f32;color:#fff;text-decoration:none;font:950 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;box-shadow:0 8px 20px rgba(0,0,0,.22);box-sizing:border-box">← RETOUR DIGIYLYFE.COM</a>\n  </div>'''

          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if 'data-digiy-return-home="1"' in text:
                  print(f'{name}: retour déjà présent, inchangé')
                  continue
              if '<body>' not in text:
                  raise SystemExit(f'{name}: balise <body> introuvable')
              text = text.replace('<body>', '<body>' + block, 1)
              p.write_text(text, encoding='utf-8')
              print(f'{name}: retour ajouté')

          Path('.github/workflows/reseau-retour-universel-20260822.yml').unlink()

      - name: Commit groupé
        run: |
          git config user.name "DIGIYLYFE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add fiche.html journal.html question.html hub.html lexique-reseau.html affiche.html .github/workflows/reseau-retour-universel-20260822.yml
          git diff --cached --quiet && exit 0
          git commit -m "UI: add DIGIYLYFE.COM return on 6 RÉSEAU pages"
          git push origin main
