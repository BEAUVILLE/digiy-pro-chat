name: Add root DIGIYLYFE return
on:
  push:
    paths:
      - '.github/workflows/add-root-return.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add strong return to root index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'data-digiy-return-home="1"'
          block = '''\n  <div data-digiy-return-home="1" style="width:min(1060px,100%);margin:12px auto 0;padding:0 12px;box-sizing:border-box">\n    <a href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;padding:11px 18px;border:2px solid #d8ad46;border-radius:999px;background:#073f32;color:#fff;text-decoration:none;font:950 15px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.02em;box-shadow:0 8px 20px rgba(0,0,0,.22);box-sizing:border-box">← RETOUR DIGIYLYFE.COM</a>\n  </div>'''
          if marker not in s:
              s = s.replace('<body>', '<body>' + block, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-root-return.yml
          git add index.html
          git commit -m "UI: add DIGIYLYFE.COM return on RÉSEAU home"
          git push
