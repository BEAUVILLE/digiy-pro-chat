name: Actualiser les langues RÉSEAU

on:
  push:
    paths:
      - '.github/workflows/actualiser-reseau-langues.yml'

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forcer la traduction complète
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'index.html': (
                  'reseau-confiance.js?v=20260801-v2-langues-europe',
                  'reseau-confiance.js?v=20260801-v3-traduction-complete'
              ),
              'hub.html': (
                  'reseau-confiance.js?v=20260801-v2-langues-europe',
                  'reseau-confiance.js?v=20260801-v3-traduction-complete'
              ),
              'recommander.html': (
                  'reseau-langues.js?v=20260801-v1',
                  'reseau-langues.js?v=20260801-v3-traduction-complete'
              ),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Publier
        run: |
          git config user.name "DIGIYLYFE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html hub.html recommander.html
          git diff --cached --quiet && exit 0
          git commit -m "Forcer la traduction complète du module RÉSEAU"
          git push