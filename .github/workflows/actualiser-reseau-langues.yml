name: Actualiser les langues RÉSEAU

on:
  push:
    paths:
      - '.github/workflows/actualiser-reseau-langues.yml'

permissions:
  contents: write

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forcer la nouvelle version multilingue
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html','hub.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('reseau-confiance.js?v=20260801-v1','reseau-confiance.js?v=20260801-v2-langues-europe')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publier
        run: |
          git config user.name "DIGIYLYFE Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html hub.html
          git diff --cached --quiet && exit 0
          git commit -m "Forcer les 7 langues et Europe sur RÉSEAU"
          git push
