name: Fix Lire Ecouter direct

on:
  push:
    paths:
      - '.github/workflows/fix-lire-ecouter-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rendre le bouton Lire / écouter directement cliquable
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="tab" type="button" role="tab" aria-selected="false" data-tab="lecture">🎧 Lire / écouter</button>'
          new = '<a class="tab" href="https://digiylyfe.net/" target="_blank" rel="noopener noreferrer" aria-label="Lire et écouter sur DIGIYLYFE.net" style="display:flex;align-items:center;justify-content:center;text-decoration:none">🎧 Lire / écouter</a>'
          if old not in s:
              raise SystemExit('Bouton Lire / écouter introuvable')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "DIGIY LYFE"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-lire-ecouter-direct.yml
          git commit -m "UI: make RÉSEAU Lire / écouter a direct link"
          git push