  <script>
    (function(){
      "use strict";
      const TARGET = "./inscription.html?cat=reseau";

      try{
        const url = new URL(window.location.href);
        ["phone","tel","p","token","pin","code","session_token","owner_phone","redirect","url"].forEach(function(k){
          url.searchParams.delete(k);
        });
        history.replaceState({}, document.title, url.pathname + url.search + url.hash);
      }catch(_){}

      setTimeout(function(){
        window.location.replace(TARGET);
      }, 450);
    })();
  </script>
